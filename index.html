<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Razorfen Crawl</title>
<meta name="description" content="A first-person quilboar dungeon crawler. Mine blood stones, fight off invading adventurers and get them home to the Warren.">
<meta name="theme-color" content="#0b0806">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Razorfen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html,body{margin:0;padding:0;background:#0b0806;color:#f1e5cd}[hidden]{display:none!important}</style>
<script>
window.RFC_STANDALONE=true;
window.RFC_BUILD='4';
if('serviceWorker' in navigator){
  // Check for a new version every time the app opens or comes back to the front.
  const hadSW=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!hadSW||reloaded)return;
    // A new version just took over. Reload straight away unless a run is in progress.
    if(typeof G==='undefined'||G.mode==='title'){reloaded=true;location.reload();}
    else if(window.sysMsg)sysMsg('A new version of Razorfen Crawl is ready. It loads next time you open the app.');
  });
  addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{});});
    }).catch(()=>{});
  });
}
</script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: full-bleed first-person view; WoW-style frames pinned to the corners; modal panels for the Warren's NPCs. */
:root{--bg:#0b0806;--panel:#1b130d;--panel2:#271b12;--edge:#6a4c2c;--edge2:#3a2a1a;--gold:#e6b450;--gold2:#a07a34;--text:#f1e5cd;--muted:#a8957b;--blood:#d6303c;--thorn:#7da046;
 --hp:#2fae2f;--rage:#c8302c;--mana:#3a78e0;--focus:#d9a33a;--encol:var(--rage);--xp:#8e48c8;
 --q0:#9d9d9d;--q1:#ffffff;--q2:#1eff00;--q3:#3a8cff;--q4:#b45cff;--qs:#ff5c66;
 --display:'Cinzel',Georgia,'Times New Roman',serif;--ui:'Alegreya Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
 --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);color-scheme:dark}
[hidden]{display:none!important}
#savebox{display:flex;flex-direction:column;gap:6px}#savebox:empty{display:none}#savebox textarea{width:100%;box-sizing:border-box;font:12px/1.3 ui-monospace,monospace;background:#0d0906;color:var(--text);border:1px solid var(--edge);border-radius:6px;padding:6px;user-select:text;-webkit-user-select:text}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;font-family:var(--ui);font-size:15px}
#game{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:var(--bg);cursor:crosshair}
#game.locked{cursor:none}
canvas#view{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
canvas#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#hud{position:absolute;inset:0;pointer-events:none}
#hud button,#hud .frame{pointer-events:auto}
.frame{background:linear-gradient(#20160e,#140d08);border:2px solid var(--edge);border-radius:8px;box-shadow:0 2px 0 #000,inset 0 0 0 1px #000}
#unit{position:absolute;top:calc(var(--st) + 10px);left:calc(var(--sl) + 10px);display:flex;gap:8px;padding:6px 10px 6px 6px;width:230px;pointer-events:none}
.portrait{position:relative;width:52px;height:52px;border-radius:50%;border:2px solid var(--gold2);background:#2a1c12;overflow:hidden;flex:none}
.portrait canvas{width:100%;height:100%;image-rendering:pixelated}
#ulvl{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);background:#000;color:var(--gold);font:800 11px var(--ui);padding:0 5px;border-radius:6px;border:1px solid var(--gold2)}
.bars{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.nm{font:700 13px var(--ui);color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:14px;background:#0a0705;border:1px solid #000;border-radius:3px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--hp);transition:width .12s}
.bar.en i{background:var(--encol)}.bar.red i{background:#c8281e}.bar.green i{background:var(--hp)}
.bar b{position:relative;display:block;text-align:center;font:700 10.5px/14px var(--ui);color:#fff;text-shadow:0 1px 1px #000;font-variant-numeric:tabular-nums}
#buffs{font:600 11px var(--ui);color:var(--muted);min-height:13px}
#target{position:absolute;top:calc(var(--st) + 10px);left:calc(var(--sl) + 252px);width:210px;padding:6px 10px;pointer-events:none}
#target .lvl{color:var(--gold);font-size:12px}
.sub{font:500 11px var(--ui);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini{position:absolute;top:calc(var(--st) + 8px);right:calc(var(--sr) + 10px);width:150px;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:auto}
#zone{font:700 12px var(--display);color:var(--gold);text-shadow:0 1px 2px #000;text-align:center;letter-spacing:.04em}
.mmwrap{width:140px;height:140px;border-radius:50%;border:3px solid var(--edge);box-shadow:0 0 0 2px #000,0 3px 8px #000a;overflow:hidden;cursor:pointer}
#mm{display:block;width:140px;height:140px}
#timer{font:800 13px var(--ui);color:var(--text);background:#000b;padding:1px 8px;border-radius:6px;font-variant-numeric:tabular-nums;text-align:center}
#timer.warn{color:#ff6a5a;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.mbtns{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.mbtns button{font:700 11px var(--ui);color:var(--text);background:#1c130c;border:1px solid var(--edge);border-radius:5px;padding:3px 6px;cursor:pointer}
.mbtns button:hover,.mbtns button:focus-visible{border-color:var(--gold);outline:none}
#chat{position:absolute;left:calc(var(--sl) + 12px);bottom:calc(var(--sb) + 34px);width:min(440px,46vw);display:flex;flex-direction:column;gap:1px;font:600 13px/1.3 var(--ui);text-shadow:0 1px 2px #000,0 0 3px #000;pointer-events:none}
.cl{transition:opacity 2s}.cl.fade{opacity:0}
.cl.say{color:#fff}.cl.yell{color:#ff5a4a}.cl.emote{color:#ff9a4a}.cl.sys{color:#ffe066}.cl.loot{color:#5aff5a}.cl.xp{color:#c8a0ff}.cl.boar{color:#e8b070}
#carry{position:absolute;right:calc(var(--sr) + 12px);bottom:calc(var(--sb) + 34px);font:700 13px var(--ui);background:#000a;border:1px solid var(--edge2);padding:4px 10px;border-radius:6px;display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.bsd,.bs{display:inline-block;width:9px;height:12px;background:linear-gradient(135deg,#ff8a90,#c0202e 60%,#6a0a12);clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);margin-right:4px;vertical-align:-1px}
#prompt{position:absolute;left:50%;top:63%;transform:translateX(-50%);font:700 15px var(--ui);background:#000c;border:1px solid var(--gold2);padding:5px 12px;border-radius:7px;white-space:nowrap}
kbd{font:800 12px var(--ui);background:var(--gold);color:#1a1008;border-radius:4px;padding:0 5px;margin-right:4px}
#err{position:absolute;left:50%;top:16%;transform:translateX(-50%);font:800 17px var(--ui);color:#ff3a2a;text-shadow:0 1px 2px #000;opacity:0;transition:opacity .2s;white-space:nowrap}
#err.on{opacity:1}
#zonetext{position:absolute;left:0;right:0;top:20%;text-align:center;opacity:0;pointer-events:none}
#zonetext.on{animation:zt 3.2s ease forwards}
@keyframes zt{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
.z1{font:800 clamp(26px,5vw,46px) var(--display);color:var(--gold);text-shadow:0 2px 0 #000,0 0 18px #000;letter-spacing:.04em;text-wrap:balance}
.z2{font:600 clamp(13px,2vw,17px) var(--ui);color:var(--text);text-shadow:0 1px 2px #000;margin-top:2px}
#cast{position:absolute;left:50%;top:70%;transform:translateX(-50%);width:220px;text-align:center}
.cbar{height:12px;background:#000;border:1px solid var(--gold2);border-radius:3px;overflow:hidden}.cbar i{display:block;height:100%;width:0;background:linear-gradient(#ffd86a,#d89a2a)}
#cast span{font:700 12px var(--ui);text-shadow:0 1px 2px #000}
#actionbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 20px);display:flex;gap:5px;padding:5px;background:#000a;border:1px solid var(--edge2);border-radius:8px}
.ab{position:relative;width:56px;height:56px;border-radius:7px;border:2px solid var(--edge);background:radial-gradient(circle at 40% 35%,#4a3420,#1c120a);color:var(--text);cursor:pointer;overflow:hidden;padding:0;font-family:var(--ui)}
.ab:hover,.ab:focus-visible{border-color:var(--gold);outline:none}
.ab .k{position:absolute;top:2px;left:4px;font:800 11px var(--ui);color:var(--gold)}
.ab .nm{position:absolute;inset:auto 2px 4px;font:700 10px/1.05 var(--ui);text-align:center}
.ab img{width:28px;height:28px;image-rendering:pixelated;margin-top:6px}
.ab .cnt{position:absolute;right:4px;bottom:2px;font:800 12px var(--ui);text-shadow:0 1px 1px #000}
.ab .cdv{position:absolute;inset:0;background:conic-gradient(#000c calc(var(--p,0)*360deg),transparent 0);pointer-events:none}
.ab .lock{display:none;position:absolute;inset:0;background:#000b;font:800 12px/52px var(--ui);color:var(--muted)}
.ab.locked .lock{display:block}.ab.oom{color:#7a8ad0}.ab.oom .nm{color:#8ea0ff}.ab.none{opacity:.45}
#xp{position:absolute;left:0;right:0;bottom:var(--sb);height:12px;background:#0a0705cc;border-top:1px solid #000}
#xp i{position:absolute;left:0;top:0;height:12px;width:0;background:linear-gradient(#a85ae0,#6a2aa0)}
#xp span{position:absolute;left:0;right:0;top:0;text-align:center;font:700 9.5px/12px var(--ui);color:#fff;text-shadow:0 1px 1px #000}
#crosshair{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff8;box-shadow:0 0 0 1px #0008}
#hurt{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(160,0,0,.75));opacity:0}
/* WoW-style action bar and bags */
#actionbar{display:flex;align-items:flex-end;gap:0;padding:0;background:none;border:0;bottom:calc(var(--sb) + 16px);pointer-events:auto}
#actionbar .barin{display:flex;gap:3px;padding:5px 7px;background:linear-gradient(#433a31,#1c1814);border:2px solid #8a7040;border-radius:3px;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #000,inset 0 2px 0 #5e5444}
#actionbar .cap{width:52px;height:78px;image-rendering:pixelated;margin:0 -4px -4px;filter:drop-shadow(0 2px 2px #000);pointer-events:none}
#actionbar .cap.r{transform:scaleX(-1)}
.ab{width:48px;height:48px;border-radius:3px;border:2px solid #000;background:#0a0806;box-shadow:inset 0 0 0 1px #6a5a40}
.ab img{width:100%;height:100%;margin:0;display:block;image-rendering:pixelated}
.ab .k{top:1px;right:4px;left:auto;color:#fff;text-shadow:0 0 2px #000,0 1px 1px #000;z-index:2}
.ab .cnt{z-index:2}.ab .lock{line-height:44px;z-index:3}.ab .cdv{z-index:1}
.ab.sep{margin-left:9px}.ab.oom img{filter:brightness(.55) sepia(1) hue-rotate(185deg) saturate(2)}
.ab:hover,.ab:focus-visible{border-color:#000;box-shadow:inset 0 0 0 2px var(--gold),0 0 8px #e6b45099}
#bagbar{position:absolute;right:calc(var(--sr) + 10px);bottom:calc(var(--sb) + 16px);display:flex;flex-direction:column;align-items:flex-end;gap:3px;pointer-events:auto}
#bagbar .carry{font:700 12px var(--ui);background:#000a;border:1px solid var(--edge2);padding:2px 8px;border-radius:5px;display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.bagrow{display:flex;gap:3px;align-items:flex-end;padding:4px;background:linear-gradient(#433a31,#1c1814);border:2px solid #8a7040;border-radius:3px;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #000}
.bagbtn{position:relative;width:36px;height:36px;padding:0;border:2px solid #000;border-radius:3px;background:#0a0806;box-shadow:inset 0 0 0 1px #5a4a30;cursor:pointer}
.bagbtn.pack{width:44px;height:44px}.bagbtn img{width:100%;height:100%;image-rendering:pixelated;display:block}.bagbtn.empty img{opacity:.25}
.bagbtn .fr{position:absolute;right:3px;bottom:0;font:800 12px var(--ui);color:#fff;text-shadow:0 1px 1px #000,0 0 3px #000}
.bagbtn:hover,.bagbtn:focus-visible{box-shadow:inset 0 0 0 2px var(--gold),0 0 8px #e6b45099;outline:none}
#qtrack{position:absolute;top:calc(var(--st) + 262px);right:calc(var(--sr) + 12px);width:210px;display:flex;flex-direction:column;gap:5px;text-align:right;font:600 12.5px/1.25 var(--ui);text-shadow:0 1px 2px #000,0 0 3px #000;pointer-events:none}
.qt b{display:block;color:#ffd24a;font-weight:800}.qt span{color:#e8e0c8}.qt.done b{color:#5aff5a}
.cl.quest{color:#ffd24a}.cl.elite{color:#ffa03a;font-weight:800}
#target.elite{border-color:#f2c84a;box-shadow:0 0 0 2px #000,0 0 14px #f2c84a88}
#target.elite::before{content:"ELITE";position:absolute;top:-10px;left:10px;font:800 10px/14px var(--ui);color:#1a1008;background:linear-gradient(#ffe08a,#c8902c);padding:0 6px;border-radius:3px;border:1px solid #000}
#target.elite::after{content:"";position:absolute;right:-24px;top:-12px;width:34px;height:70px;background:linear-gradient(160deg,#fff0a8,#c8902c 60%,#7a5410);clip-path:polygon(0 18%,55% 0,42% 16%,100% 6%,70% 28%,100% 36%,62% 48%,90% 62%,48% 66%,64% 92%,0 74%);filter:drop-shadow(0 0 1px #000)}
.qrow{background:#0004;border:1px solid var(--edge2);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:5px}
.qrow .qn{font:700 15px var(--display);color:#ffd24a}.qrow.done .qn{color:#5aff5a}.qrow .qg{font-weight:700}.qrow .qr{font-size:13px;color:#d8c8a8}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px}
.choice{display:flex;gap:8px;align-items:flex-start;text-align:left;background:#0d0906;border:2px solid #3a2a1a;border-radius:8px;padding:7px;color:var(--text);font:600 13px/1.3 var(--ui);cursor:pointer}
.choice:hover,.choice:focus-visible{border-color:var(--gold);outline:none}.choice img{width:36px;height:36px;image-rendering:pixelated;flex:none}
@media (max-width:900px),(max-height:520px){#qtrack{top:calc(var(--st) + 200px);width:170px;font-size:11.5px}}
@media (max-width:520px){#qtrack{display:none}}
/* touch */
#touch{position:absolute;inset:0;pointer-events:none}
#stick{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid #fff3;background:#0004;opacity:0;transition:opacity .15s}
#stick.on{opacity:1}#stick i{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;background:#f1e5cd55;border:2px solid #fff6;transform:translate(-50%,-50%)}
#atkpad{position:absolute;right:calc(var(--sr) + 22px);bottom:calc(var(--sb) + 30px);width:132px;height:132px;border-radius:50%;border:3px solid #d6303c99;background:radial-gradient(circle,#d6303c33,#5a0a1233);display:grid;place-items:center;font:800 12px var(--ui);color:#ffd0d0aa;letter-spacing:.1em;text-transform:uppercase}
#atkpad.on{background:radial-gradient(circle,#d6303c66,#5a0a1255);border-color:#ff5a66}
#tabil{position:absolute;right:calc(var(--sr) + 166px);bottom:calc(var(--sb) + 26px);display:grid;grid-template-columns:repeat(3,52px);gap:6px;pointer-events:auto}
#tabil .ab{width:52px;height:52px}
#tUse{position:absolute;right:calc(var(--sr) + 22px);bottom:calc(var(--sb) + 172px);max-width:180px;pointer-events:auto;font:800 14px var(--ui);color:#1a1008;background:var(--gold);border:2px solid #fff6;border-radius:24px;padding:8px 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.touch #actionbar,body.touch #prompt,body.touch #crosshair{display:none}
body.touch #bagbar{right:auto;left:calc(var(--sl) + 10px);bottom:calc(var(--sb) + 16px);align-items:flex-start}
body.touch .bagbtn{width:32px;height:32px}body.touch .bagbtn.pack{width:38px;height:38px}
body.touch #chat{top:calc(var(--st) + 82px);bottom:auto;width:min(300px,34vw);font-size:11px}
body.touch .cl{display:none}body.touch .cl:nth-last-child(-n+3){display:block}
@media (max-height:480px),(max-width:700px){#unit{width:190px;padding:4px 8px 4px 4px}.portrait{width:42px;height:42px}#target{left:calc(var(--sl) + 208px);width:170px}.mmwrap,#mm{width:104px;height:104px}#mini{width:118px}#tabil{grid-template-columns:repeat(3,46px)}#tabil .ab{width:46px;height:46px}.ab .nm{font-size:9px}#atkpad{width:116px;height:116px}#tabil{right:calc(var(--sr) + 148px)}#tUse{bottom:calc(var(--sb) + 154px)}}
@media (max-width:520px){#target{top:calc(var(--st) + 74px);left:calc(var(--sl) + 10px)}body.touch #chat{top:calc(var(--st) + 140px)}#tabil{right:calc(var(--sr) + 14px);bottom:calc(var(--sb) + 160px);grid-template-columns:repeat(5,44px)}#tabil .ab{width:44px;height:44px}#tUse{bottom:calc(var(--sb) + 214px)}}
/* panels */
#panel{position:absolute;inset:0;background:#0007;display:grid;place-items:center;padding:calc(var(--st) + 10px) calc(var(--sr) + 10px) calc(var(--sb) + 10px) calc(var(--sl) + 10px);z-index:5}
.pbox{width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;background:linear-gradient(#22170f,#150e09);border:2px solid var(--edge);border-radius:10px;box-shadow:0 0 0 2px #000,0 10px 40px #000c;overflow:hidden}
.pbox header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--edge2);background:#1a110a}
.pbox h2{margin:0;font:700 18px var(--display);color:var(--gold);letter-spacing:.03em;text-wrap:balance}
#pclose{background:none;border:1px solid var(--edge);color:var(--text);border-radius:6px;width:32px;height:32px;font-size:16px;cursor:pointer;flex:none}
#pbody{padding:12px 14px 16px;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:10px;user-select:none}
#pbody h3{margin:6px 0 0;font:700 14px var(--display);color:var(--gold);letter-spacing:.03em}
#pbody p{margin:0;line-height:1.4;max-width:65ch}
.flav{color:#d8c8a8;font-style:italic}
.dim{color:var(--muted)}.small{font-size:13px}.good{color:#5aff5a}.bad{color:#ff5a4a}
.q0{color:var(--q0)}.q1{color:var(--q1)}.q2{color:var(--q2)}.q3{color:var(--q3)}.q4{color:var(--q4)}.qs{color:var(--qs)}
.btn{font:700 14px var(--ui);color:#1a1008;background:linear-gradient(#f0c464,#c8902c);border:1px solid #000;border-radius:7px;padding:9px 14px;cursor:pointer;box-shadow:inset 0 1px 0 #fff6}
.btn:hover,.btn:focus-visible{filter:brightness(1.1);outline:2px solid #fff6;outline-offset:1px}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:default}
.btn.ghost{background:#2a1d13;color:var(--text);border-color:var(--edge);box-shadow:none}
.btn.on{outline:2px solid var(--cc,var(--gold))}
.btn.sm{padding:6px 10px;font-size:13px}.btn.danger{color:#ff8a7a;border-color:#7a2a20}
.btn small{display:block;font-weight:500;font-size:11px;opacity:.8}
.wallet{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;font:700 14px var(--ui);background:#0006;border:1px solid var(--edge2);border-radius:7px;padding:7px 10px}
.mg{color:#ffd24a}.ms{color:#d8dce4}.mc{color:#d88a4a}
.bag{border:1px solid var(--edge2);border-radius:8px;padding:8px;background:#0004}
.bagh{display:flex;justify-content:space-between;font:700 13px var(--ui);margin-bottom:6px;color:#d8c8a8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px}

const TAU=Math.PI*2;
function angDiff(a,b){let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}

function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function moneyHTML(c){c=Math.max(0,Math.floor(c));const g=Math.floor(c/10000),s=Math.floor(c%10000/100),cc=c%100;const o=[];if(g)o.push(`<span class="mg">${g}g</span>`);if(s||g)o.push(`<span class="ms">${s}s</span>`);o.push(`<span class="mc">${cc}c</span>`);return o.join(' ');}
function moneyTxt(c){c=Math.max(0,Math.floor(c));const g=Math.floor(c/10000),s=Math.floor(c%10000/100),cc=c%100;const o=[];if(g)o.push(g+' Gold');if(s)o.push(s+' Silver');if(cc||!o.length)o.push(cc+' Copper');return o.join(', ');}

/* ===== sound (synthesized) ===== */
const SFX={ctx:null,on:true,nb:null,last:{},
 init(){if(this.ctx)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){this.ctx=null;}},
 tone(f,d,type,vol,slide){if(!this.on||!this.ctx)return;const c=this.ctx,t=c.currentTime;const o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);g.gain.setValueAtTime(vol||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02);},
 noise(d,vol,freq){if(!this.on||!this.ctx)return;const c=this.ctx,t=c.currentTime;if(!this.nb){const len=c.sampleRate;const b=c.createBuffer(1,len,c.sampleRate);const ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;this.nb=b;}const s=c.createBufferSource();s.buffer=this.nb;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||1200;const g=c.createGain();g.gain.setValueAtTime(vol||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(c.destination);s.start(t);s.stop(t+d+.02);},

  switch(n){
   case 'swing':this.noise(.14,.07,2200);break;
   case 'hit':this.tone(110,.13,'square',.08,.5);this.noise(.08,.09,500);break;
   case 'crit':this.tone(90,.2,'sawtooth',.09,.4);this.noise(.12,.12,700);break;
   case 'mine':this.tone(rand(820,980),.07,'triangle',.07,.6);this.noise(.04,.05,3000);break;

   case 'coin':this.tone(1500,.05,'square',.03);setTimeout(()=>this.tone(1900,.06,'square',.03),50);break;
   case 'level':[523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.tone(f,.22,'triangle',.07),i*95));break;
   case 'trap':this.noise(.8,.2,160);this.tone(60,.6,'sawtooth',.08,.5);break;
   case 'thorn':this.noise(.25,.08,1800);this.tone(300,.2,'triangle',.04,1.6);break;
   case 'heal':this.tone(660,.3,'sine',.04,1.5);break;
   case 'die':this.tone(320,.8,'sawtooth',.08,.2);break;
   case 'click':this.tone(520,.035,'square',.025);break;
   case 'err':this.tone(200,.08,'square',.04);break;
   case 'portal':this.tone(300,.6,'sine',.06,3);this.noise(.5,.05,900);break;
   case 'roar':this.noise(.5,.14,380);this.tone(90,.5,'sawtooth',.08,.6);break;
   case 'quake':this.noise(1.6,.22,90);break;
   case 'deposit':[392,523,659].forEach((f,i)=>setTimeout(()=>this.tone(f,.25,'sine',.06),i*110));break;
  }}
};

function newUid(){return Date.now().toString(36)+'-'+(UID++);}
function genGear(lvl,advCls,qBonus){
 const A=ADV[advCls]||ADV.warrior;
 let r=Math.random()-(qBonus||0);
 const q=r<.02?4:r<.1?3:r<.34?2:r<.78?1:0;
 const Q=QUAL[q];const slotR=Math.random();
 const it={uid:newUid(),q,ilvl:Math.max(1,lvl+randi(-1,1)),armor:0,sta:0,pow:0};
 if(slotR<.3){it.slot='weapon';it.at=pick(A.wpn);it.name=pick(WEAPN[it.at]);it.pow=Math.max(1,Math.round((2+it.ilvl*.9)*Q.m));}
 else if(slotR<.4){it.slot='trinket';it.at='trinket';it.name=pick(TRINKETS);it.pow=Math.round((.5+it.ilvl*.25)*Q.m);it.sta=Math.round((.5+it.ilvl*.3)*Q.m);}
 else{it.slot=pick(['head','chest','legs']);it.at=A.armor;if(chance(.25))it.at=pick(['cloth','leather','mail','plate']);it.name=pick(GEARN[it.slot][it.at]);it.armor=Math.max(1,Math.round((it.ilvl*1.1+4)*ARMOR_M[it.at]*SLOT_M[it.slot]*Q.m*.5));}
 if(q===0)it.name=pick(['Worn ','Tattered ','Rusty ','Cracked '])+it.name;
 if(q>=2&&it.slot!=='trinket'){const s=pick(SUFFIX);it.name+=' '+s.n;it.sta+=Math.round((1+it.ilvl*.45)*s.sta*Q.m*.6);it.pow+=Math.round((.5+it.ilvl*.3)*s.pow*Q.m*.6);}
 it.v=Math.round((it.ilvl*5+8)*Q.m*Q.m);
 return it;}
function makeGear(lvl,slot,at,q){const Q=QUAL[q];const it={uid:newUid(),q,ilvl:Math.max(1,lvl),armor:0,sta:0,pow:0,slot,at};
 if(slot==='weapon'){it.name=pick(WEAPN[at]);it.pow=Math.max(1,Math.round((2+it.ilvl*.9)*Q.m));}
 else if(slot==='trinket'){it.at='trinket';it.name=pick(TRINKETS);it.pow=Math.round((.5+it.ilvl*.25)*Q.m);it.sta=Math.round((.5+it.ilvl*.3)*Q.m);}
 else{it.name=pick(GEARN[slot][at]);it.armor=Math.max(1,Math.round((it.ilvl*1.1+4)*ARMOR_M[at]*SLOT_M[slot]*Q.m*.5));}
 if(q>=2&&slot!=='trinket'){const s=pick(SUFFIX);it.name+=' '+s.n;it.sta+=Math.round((1+it.ilvl*.45)*s.sta*Q.m*.6);it.pow+=Math.round((.5+it.ilvl*.3)*s.pow*Q.m*.6);}
 if(q===4)it.name=pick(['Corrupted ','Ancient ','Champion\'s ','Warlord\'s '])+it.name;
 it.v=Math.round((it.ilvl*5+8)*Q.m*Q.m);return it;}
function gearFor(cls,lvl,q,slot){const C=CLASSES[cls];slot=slot||pick(['weapon','head','chest','legs','trinket']);const at=slot==='weapon'?pick(C.weapons):slot==='trinket'?'trinket':C.armor[C.armor.length-1-((chance(.3)&&C.armor.length>1)?1:0)];return makeGear(lvl,slot,at,q);}

 const set=(x,y)=>{if(x>0&&y>0&&x<MW-1&&y<MH-1)MAP[y*MW+x]=0;};
 for(const [x,y,w,h] of ROOMS)for(let j=0;j<h;j++)for(let i=0;i<w;i++)set(x+i,y+j);
 for(const [a,b,y] of HCOR)for(let x=a;x<=b;x++)set(x,y);
 for(const [x,a,b] of VCOR)for(let y=a;y<=b;y++)set(x,y);
 for(const [x,y] of PILLARS)MAP[y*MW+x]=matFor(x,y)===4?4:(matFor(x,y)===5?5:1);
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const z=zoneAt(x+.5,y+.5);FLOORT[y*MW+x]=z===4?1:z===5?2:z===3?3:0;}
}
function computeLight(extra){

 const add=(sx,sy,rad,amt)=>{for(let y=Math.max(0,(sy-rad)|0);y<=Math.min(MH-1,(sy+rad)|0);y++)for(let x=Math.max(0,(sx-rad)|0);x<=Math.min(MW-1,(sx+rad)|0);x++){const d=dist(sx,sy,x+.5,y+.5);if(d<rad){const f=1-d/rad;LIGHT[y*MW+x]+=amt*f*f;}}};
 for(let y=WARREN.y0;y<WARREN.y1;y++)for(let x=WARREN.x0;x<WARREN.x1;x++)LIGHT[y*MW+x]+=.28;
 for(const [x,y] of WARREN_SPOTS.braziers)add(x,y,4.5,.7);
 add(WARREN_SPOTS.shrine[0],WARREN_SPOTS.shrine[1],3.5,.6);
 for(const [x,y] of TORCHES)add(x,y,4,.6);
 for(const [x,y] of ENTRANCES)add(x,y,3.5,.9);
 if(extra)for(const e of extra)add(e[0],e[1],e[2],e[3]);
}

  for(const c of cs)for(let i=0;i<c.length&&q>0;i++){if(!c[i]){const t=Math.min(max,q);c[i]={key:it.key,qty:t};q-=t;}}it.qty=q;return q===0;}

function los(ax,ay,bx,by){const d=dist(ax,ay,bx,by);const n=Math.ceil(d/.2);for(let i=1;i<n;i++){const t=i/n;if(solid(ax+(bx-ax)*t,ay+(by-ay)*t))return false;}return true;}
function blockedAt(x,y,r){return solid(x-r,y-r)||solid(x+r,y-r)||solid(x-r,y+r)||solid(x+r,y+r);}
function moveBody(e,dx,dy,r){const n=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/.18));for(let i=0;i<n;i++){const nx=e.x+dx/n;if(!blockedAt(nx,e.y,r))e.x=nx;const ny=e.y+dy/n;if(!blockedAt(e.x,ny,r))e.y=ny;}}
const BFS_PREV=new Int32Array(MW*MH),BFS_Q=new Int32Array(MW*MH);
function findPath(sx,sy,tx,ty){const s=idx(sx,sy),t=idx(tx,ty);if(s===t)return [];if(MAP[t]){return null;}BFS_PREV.fill(-1);let h=0,tl=0;BFS_Q[tl++]=s;BFS_PREV[s]=s;const D=[1,-1,MW,-MW];
 while(h<tl){const c=BFS_Q[h++];if(c===t)break;for(const d of D){const n=c+d;if(n<0||n>=MW*MH||BFS_PREV[n]!==-1||MAP[n])continue;BFS_PREV[n]=c;BFS_Q[tl++]=n;}}
 if(BFS_PREV[t]===-1)return null;const path=[];let c=t;while(c!==s){path.push([(c%MW)+.5,((c/MW)|0)+.5]);c=BFS_PREV[c];}path.reverse();return path;}

/* ===== player ===== */
function healPlayer(h,silent){if(P.dead)return;const b=P.hp;P.hp=Math.min(P.maxHp,P.hp+h);if(!silent&&P.hp-b>=1)selfFloat('+'+Math.round(P.hp-b),'#5aff6a');}
function gainRage(n){if(S.cls==='warrior')P.en=Math.min(P.maxEn,P.en+n);}
function updatePlayer(dt){
 if(P.dead)return;
 for(const k in P.cd)if(P.cd[k]>0)P.cd[k]=Math.max(0,P.cd[k]-dt);
 P.potCd=Math.max(0,P.potCd-dt);P.stun=Math.max(0,P.stun-dt);P.root=Math.max(0,P.root-dt);P.slow=Math.max(0,P.slow-dt);P.hurt=Math.max(0,P.hurt-dt*1.4);P.shake=Math.max(0,P.shake-dt*2);if(P.reload>0)P.reload=Math.max(0,P.reload-dt);
 for(const k in P.buffs){const b=P.buffs[k];b.t-=dt;if(b.hot)healPlayer(b.hot*dt,true);if(b.t<=0){if(k==='stoneskin'){if(tal('livingstone')&&P.shield>0)healPlayer(P.shield);P.shield=0;}delete P.buffs[k];}}
 const ooc=W_.time-P.lastDmgT>6;
 if(P.inW)healPlayer(P.maxHp*(.05+S.warren.geo*.05)*dt,true);else if(ooc)healPlayer(P.maxHp*.012*dt,true);
 if(S.cls==='warrior'){if(P.inW)P.en=Math.min(P.maxEn,P.en+15*dt);else if(ooc)P.en=Math.max(0,P.en-1.5*dt);else P.en=Math.min(P.maxEn,P.en+1*dt);}
 else P.en=Math.min(P.maxEn,P.en+P.regen*dt*(P.inW?3:1));
 let f=0,s=0,turn=0;const K=G.keys;
 if(K.KeyW||K.ArrowUp)f+=1;if(K.KeyS||K.ArrowDown)f-=1;if(K.KeyA)s-=1;if(K.KeyD)s+=1;if(K.ArrowLeft)turn-=1;if(K.ArrowRight)turn+=1;
 if(G.stick.active){f+=-G.stick.y;s+=G.stick.x;}
 P.a+=turn*2.4*dt+G.look;G.look=0;
 const len=Math.hypot(f,s);if(len>1){f/=len;s/=len;}
 const sp=P.speed*(P.slow>0?.6:1);
 if(P.channel&&P.channel.still&&len>.15)cancelChannel('Interrupted');
 const canMove=!(P.root>0||P.stun>0||P.dash);
 if(canMove&&len>.05){const mx=(Math.cos(P.a)*f-Math.sin(P.a)*s)*sp*dt,my=(Math.sin(P.a)*f+Math.cos(P.a)*s)*sp*dt;moveBody(P,mx,my,.24);}
 const moving=canMove&&len>.1;P.bobAmt+=((moving?Math.min(1,len):0)-P.bobAmt)*Math.min(1,dt*8);if(moving)P.bobPh+=dt*sp*2.3;
 if(P.dash){const d=P.dash;d.t-=dt;const v=d.speed*dt;moveBody(P,Math.cos(d.a)*v,Math.sin(d.a)*v,.24);
  if(d.charge&&!d.hit){for(const e of foes()){if(dist(P.x,P.y,e.x,e.y)<e.r+.65){d.hit=true;hitFoe(e,P.baseDmg*.6,{stun:.9*(tal('unstop')?2:1),an:d.a,kb:.5});SFX.play('hit');P.shake=.6;d.t=0;break;}}}
  if(d.t<=0)P.dash=null;}
 if(P.swing){const sw=P.swing;sw.t+=dt*(sw.speed||1);if(!sw.done&&sw.t>=sw.sp.wind){sw.done=true;applyAttack(sw.sp,sw.dir);}if(sw.t>=sw.sp.dur){P.swing=null;if(P.queued){const q=P.queued;P.queued=null;doAttack(q);}}}
 if(P.channel){const ch=P.channel;ch.t+=dt;if(ch.kind==='mine'&&Math.floor(ch.t*2.4)!==Math.floor((ch.t-dt)*2.4))SFX.play('mine');if(ch.t>=ch.dur){P.channel=null;ch.done();}}
 const z=zoneAt(P.x,P.y);P.inW=z===4;if(z!==P.zone){P.zone=z;zoneText(z);onZoneChange(z);}
 if(!P.inW&&!W_.run.started){W_.run.started=true;sysMsg('You leave the Warren. Adventurers will find their way into the tunnels soon.');}
 if(W_.portal&&!W_.portal.seen&&dist(P.x,P.y,W_.portal.x,W_.portal.y)<6&&los(P.x,P.y,W_.portal.x,W_.portal.y)){W_.portal.seen=true;sysMsg('You found a Root Gate. Step into it to return to the Warren.');}
}
function onZoneChange(z){if(z===4){if(P.coin>0){S.gold+=P.coin;sysMsg(`You stash ${moneyTxt(P.coin)} in the tribe's hoard.`);P.coin=0;SFX.play('coin');}const n=countItem('bloodstone');if(n>0)sysMsg(`You're home with ${n} Blood Stones. Offer them at the Thorn Shrine to keep them.`);S.stats.extracts++;writeSave();}}
function foes(){return W_.ents.filter(e=>e.kind==='adv'&&!e.dead);}
function aimTarget(range){let best=null,bs=1e9;for(const e of foes()){const d=dist(P.x,P.y,e.x,e.y);if(d>range)continue;const an=Math.atan2(e.y-P.y,e.x-P.x);const ad=Math.abs(angDiff(an,P.a));if(ad>.35)continue;if(!los(P.x,P.y,e.x,e.y))continue;const sc=ad*6+d*.2;if(sc<bs){bs=sc;best=e;}}return best;}
function aimPoint(range){const t=aimTarget(range);if(t)return [t.x,t.y];let x=P.x,y=P.y;for(let i=0;i<range/.2;i++){const nx=x+Math.cos(P.a)*.2,ny=y+Math.sin(P.a)*.2;if(solid(nx,ny))break;x=nx;y=ny;}return [x,y];}
function doAttack(dir){if(P.dead||G.mode!=='play'||G.paused)return;SFX.init();const C=CLASSES[S.cls];const sp=C.atk[dir]||C.atk.tap;if(P.stun>0)return;
 if(P.channel){if(P.channel.kind==='mine')cancelChannel();else return;}
 if(P.swing){if(P.swing.t>P.swing.sp.dur*.55)P.queued=dir;return;}
 if(sp.reload&&P.reload>0)return;

 P.en-=cost;let speed=1;if(P.buffs.bloodrage&&tal('frenzy'))speed=1.25;if(sp.reload){const m=1-tal('quick')*.15;speed=1/m;P.reloadMax=sp.dur*m;P.reload=P.reloadMax;}

   spawnProj({from:'p',x:P.x+Math.cos(a)*.25,y:P.y+Math.sin(a)*.25,a,speed:sp.speed,dmg,kind:sp.proj,pierce:sp.proj==='bolt'&&tal('piercing')?1:0,burn:sp.proj==='fireball'&&tal('burning'),pyro:sp.proj==='fireball'&&tal('pyro'),bleed:sp.proj==='bolt'&&tal('serrated')});}

 else if(sp.k==='cone'){const range=sp.range+tal('searing')*.6,mult=1+tal('searing')*.1;for(const e of foes()){const d=dist(P.x,P.y,e.x,e.y);if(d>range+e.r)continue;const an=Math.atan2(e.y-P.y,e.x-P.x);if(d>.45&&Math.abs(angDiff(an,P.a))>sp.arc/2)continue;if(!los(P.x,P.y,e.x,e.y))continue;hitFoe(e,base*mult,{});}

function useAbility(i){if(P.dead||G.mode!=='play'||G.paused)return;SFX.init();const C=CLASSES[S.cls];const id=C.abil[i];const A=ABIL[id];
 if(!abilReady(id)){err(`Requires level ${A.lvl}`);return;}if(P.cd[id]>0){err('That ability isn\'t ready yet.');return;}if(P.stun>0)return;if(P.en<A.cost){err(`Not enough ${C.enName.toLowerCase()}`);return;}

  $('#thp').style.width=(tg.kind==='npc'?100:clamp(tg.hp/tg.maxHp,0,1)*100)+'%';$('#thp').parentElement.className='bar hp '+(isA?'red':'green');$('#thpt').textContent=tg.kind==='npc'?'':`${Math.ceil(tg.hp)} / ${tg.maxHp}`;}else tf.hidden=true;
 const pr=G.mode==='play'&&!P.dead&&!P.channel?findInteract():null;const pe=$('#prompt'),tu=$('#tUse');if(pr){pe.hidden=false;pe.innerHTML=`<kbd>E</kbd> ${esc(pr.label)}`;tu.hidden=false;tu.textContent=pr.label.replace(/^(Talk to|Pray at the|Open the) /,'');}else{pe.hidden=true;tu.hidden=true;}
 const cb=$('#cast');const ch=P.channel;if(ch){cb.hidden=false;cb.querySelector('i').style.width=(clamp(ch.t/ch.dur,0,1)*100)+'%';cb.querySelector('span').textContent=ch.label;}else cb.hidden=true;
 const run=W_.run;const tm=$('#timer');if(run.started&&!run.ended){const left=run.dur-run.t;tm.textContent=fmtT(left);tm.classList.toggle('warn',left<=120);}else{tm.textContent=run.ended?'Collapsed':'Run starts when you leave';tm.classList.remove('warn');}
 $('#zone').textContent=ZONES[P.zone].n;
 const n=countItem('bloodstone');$('#carryN').textContent=n;$('#bagFree').textContent=`${freeSlots()} free`;$('#coinC').innerHTML=P.coin?moneyHTML(P.coin):'';
 for(const b of document.querySelectorAll('.ab')){const v=b.dataset.ab;const cdv=b.querySelector('.cdv');if(v==='pot'){b.querySelector('.cnt').textContent=countItem('hpot')+countItem('poultice');if(cdv)cdv.style.setProperty('--p',P.potCd>0?(P.potCd/15):0);continue;}if(v==='ward'){const k=countItem('rootward');b.querySelector('.cnt').textContent=k;b.classList.toggle('none',!k);continue;}
  const id=C.abil[+v];const A=ABIL[id];const ready=abilReady(id);b.classList.toggle('locked',!ready);b.classList.toggle('oom',ready&&P.en<A.cost);const cdl=P.cd[id]||0;cdv.style.setProperty('--p',cdl>0?cdl/A.cd:0);}
 const need=xpNeed(c.lvl);$('#xp i').style.width=(c.lvl>=MAX_LVL?100:clamp(c.xp/need,0,1)*100)+'%';$('#xp span').textContent=c.lvl>=MAX_LVL?`Level ${c.lvl}`:`Level ${c.lvl} · ${c.xp} / ${need} XP`;
}

/* ===== screens ===== */
function showTitle(){G.mode='title';closePanel();const sc=$('#screen');sc.hidden=false;let sel=S.cls;
 const draw=()=>{sc.innerHTML=`<div class="card title"><div class="eyebrow">A quilboar extraction crawl</div><h1>Razorfen Crawl</h1><p class="pitch">The Horde and the Alliance keep coming down here to "farm" your people. Mine the blood of Agamaggan, ambush the adventurers, and haul it all home to the Warren before the tunnels collapse.</p>
 <div class="classes">${Object.keys(CLASSES).map(k=>{const C=CLASSES[k];return `<button class="cls ${k===sel?'on':''}" data-k="${k}" style="--cc:${C.color}"><canvas width="32" height="48" data-pk="${k}"></canvas><div><b>${C.short}</b><span class="lv">Level ${S.classes[k].lvl}</span><p>${C.blurb}</p></div></button>`;}).join('')}</div>
 <button class="btn go" data-go="1" ${G.cloudPending?'disabled':''}>${G.cloudPending?'Loading your save…':'Enter the Warren'}</button><div class="menu"><button class="btn ghost sm" data-title="importsave">Load a save code</button><button class="btn ghost sm" data-title="exportsave">Back up my save</button><button class="btn ghost sm" data-title="saves">New game</button></div>${G.titleNote?`<p class="good">${esc(G.titleNote)}</p>`:''}<p class="dim small">${CLOUD.ready?'Your progress saves to your Claude account, so it follows you between devices.':G.cloudPending?'Checking your Claude account for saved progress…':(window.RFC_STANDALONE?'Your progress saves on this device. Use Menu, then Back up my save, to keep a copy.':'Your progress saves in this browser only.')}</p><p class="dim small ctl">${G.touch||matchMedia('(pointer:coarse)').matches?'Left thumb moves. Drag the right side to look. Swipe across the red pad to swing in that direction.':'WASD to move, mouse to look. Hold the left button, drag a direction and let go to swing that way. Right-click for your up-swipe move.'} Plays in portrait or landscape.</p>${window.RFC_BUILD?`<p class="dim small">Build ${window.RFC_BUILD}</p>`:''}</div>`;
  for(const cv of sc.querySelectorAll('canvas[data-pk]')){const k=cv.dataset.pk;const c=cv.getContext('2d');c.imageSmoothingEnabled=false;c.drawImage(boarSprites({role:k==='warrior'?'warrior':k,pads:k==='warrior'}).fr[0].cv,0,0);}};
 draw();sc.onclick=e=>{const tb=e.target.closest('[data-title]');if(tb){SFX.init();openPanel('saves');const a=tb.dataset.title;if(a!=='saves'){const x=$('#pbody [data-act="'+a+'"]');if(x)panelAct(x);}return;}const b=e.target.closest('.cls');if(b){sel=b.dataset.k;SFX.init();SFX.play('click');draw();return;}if(e.target.closest('[data-go]')){if(G.cloudPending)return;SFX.init();G.titleNote='';S.cls=sel;sc.hidden=true;G.mode='play';P.maxHp=0;newRun();buildActionBar();banner('The Warren','Home of the Razorfen');if(!S.seenIntro){S.seenIntro=1;setTimeout(()=>{sysMsg('Welcome home. Walk out of the Warren to start a run, mine the red veins, then come back and offer the stones at the Thorn Shrine.');sysMsg(G.touch?'Swipe across the red pad to attack. Each direction is a different move.':'Hold left mouse, drag a direction and release to attack. Each direction is a different move.');},600);}writeSave();}};}
function showDeath(src,lost,coin){G.mode='dead';closePanel();const sc=$('#screen');sc.hidden=false;let who='the tunnels';if(src&&src.kind==='adv')who=`<b style="color:${ADV[src.cls].color}">${esc(src.name)}</b>, level ${src.lvl} ${RACES[src.race].n} ${ADV[src.cls].n}${src.guild?` &lt;${esc(src.guild)}&gt;`:''}`;else if(src&&src.cave)who='a cave-in. You were still in the tunnels when time ran out';
 const parts=[];if(lost.stones)parts.push(`${lost.stones} Blood Stone${lost.stones>1?'s':''}`);if(lost.items)parts.push(`${lost.items} item${lost.items>1?'s':''}`);if(coin)parts.push(moneyTxt(coin));
 sc.innerHTML=`<div class="card death"><h2>You have died</h2><p>Slain by ${who}.</p><p class="lost">${parts.length?'Left behind: '+parts.join(' · '):'You had nothing in your bags. Small mercies.'}</p><p class="dim small">Your level, talents and equipped gear are safe.</p><button class="btn go" data-go="1">Return to the Warren</button></div>`;
 sc.onclick=e=>{if(e.target.closest('[data-go]')){sc.hidden=true;G.mode='play';newRun();buildActionBar();banner('The Warren','The tribe drags you home.');}};}
function showSummary(msg){G.mode='summary';closePanel();const run=W_.run;const n=countItem('bloodstone');if(n){removeItem('bloodstone',n);S.stones+=n;S.stats.banked+=n;addXP(n*3);}
 const sc=$('#screen');sc.hidden=false;sc.innerHTML=`<div class="card"><h2>Run complete</h2><p>${esc(msg)}</p><div class="big2"><div><span>Adventurers slain</span><b>${run.kills}</b></div><div><span>Stones mined</span><b>${run.mined}</b></div><div><span>Offered now</span><b>${n}</b></div><div><span>Hoard</span><b>${S.stones}</b></div></div>${n?'<p class="dim small">The shaman offered the stones you were carrying.</p>':''}<button class="btn go" data-go="1">Begin the next run</button></div>`;writeSave();
 sc.onclick=e=>{if(e.target.closest('[data-go]')){sc.hidden=true;G.mode='play';newRun();buildActionBar();banner('The Warren','Veins refilled · traps re-armed');}};}

/* ===== input ===== */
function swipeDir(dx,dy,th){if(Math.abs(dx)<th&&Math.abs(dy)<th)return 'tap';return Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');}
function enableTouch(){if(G.touch)return;G.touch=true;$('#touch').hidden=false;document.body.classList.add('touch');}
function setupInput(){const g=$('#game');G.swipes={};
 const isUI=t=>t.closest&&t.closest('button,.pbox,#tip,#mini,#screen,#chat,#bagbar,#actionbar,input,a');
 g.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')enableTouch();if(G.mode!=='play'||G.paused)return;if(isUI(e.target))return;SFX.init();if(TIP)hideTip();
  if(e.pointerType==='touch'||e.pointerType==='pen'){const pad=$('#atkpad').getBoundingClientRect();const inPad=e.clientX>=pad.left-10&&e.clientX<=pad.right+10&&e.clientY>=pad.top-10&&e.clientY<=pad.bottom+10;
   if(inPad){G.swipes[e.pointerId]={x:e.clientX,y:e.clientY};$('#atkpad').classList.add('on');}
   else if(e.clientX<R.cw*.45){G.stickId=e.pointerId;G.stickO={x:e.clientX,y:e.clientY};G.stick.active=true;G.stick.x=0;G.stick.y=0;const st=$('#stick');st.style.left=e.clientX+'px';st.style.top=e.clientY+'px';st.classList.add('on');st.querySelector('i').style.transform='translate(-50%,-50%)';}
   else{G.lookId=e.pointerId;G.lookX=e.clientX;}
   e.preventDefault();return;}
  if(G.panel&&G.panel!=='map')closePanel();
  if(e.button===0){if(document.pointerLockElement!==g&&!G.noLock){try{const p=g.requestPointerLock();if(p&&p.catch)p.catch(()=>{G.noLock=true;});}catch(er){G.noLock=true;}}G.mswipe={dx:0,dy:0};}
  else if(e.button===2){doAttack('up');}});
 g.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||e.pointerType==='pen'){if(e.pointerId===G.stickId){const dx=e.clientX-G.stickO.x,dy=e.clientY-G.stickO.y;const m=46;const l=Math.hypot(dx,dy);const k=l>m?m/l:1;G.stick.x=dx*k/m;G.stick.y=dy*k/m;$('#stick i').style.transform=`translate(calc(-50% + ${dx*k}px),calc(-50% + ${dy*k}px))`;}else if(e.pointerId===G.lookId){G.look+=(e.clientX-G.lookX)*.0062;G.lookX=e.clientX;}return;}
  if(G.mode!=='play'||G.paused)return;if(G.mswipe){G.mswipe.dx+=e.movementX||0;G.mswipe.dy+=e.movementY||0;return;}
  if(document.pointerLockElement===g||(G.noLock&&!G.panel&&!isUI(e.target)))G.look+=(e.movementX||0)*.0024;});
 const up=e=>{if(e.pointerType==='touch'||e.pointerType==='pen'){const s=G.swipes[e.pointerId];if(s){delete G.swipes[e.pointerId];$('#atkpad').classList.remove('on');doAttack(swipeDir(e.clientX-s.x,e.clientY-s.y,20));}
   if(e.pointerId===G.stickId){G.stickId=null;G.stick.active=false;G.stick.x=G.stick.y=0;$('#stick').classList.remove('on');}if(e.pointerId===G.lookId)G.lookId=null;return;}
  if(G.mswipe&&e.button===0){const {dx,dy}=G.mswipe;G.mswipe=null;doAttack(swipeDir(dx,dy,9));}};
 window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
 g.addEventListener('contextmenu',e=>e.preventDefault());
 document.addEventListener('pointerlockchange',()=>{$('#game').classList.toggle('locked',document.pointerLockElement===g);});
 addEventListener('keydown',e=>{if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;G.keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(e.code))e.preventDefault();if(G.mode!=='play')return;if(e.repeat)return;
  switch(e.code){case 'KeyE':case 'KeyF':interact();break;case 'Digit1':useAbility(0);break;case 'Digit2':useAbility(1);break;case 'Digit3':useAbility(2);break;case 'Digit4':usePotion();break;case 'Digit5':useWard();break;
   case 'KeyB':case 'KeyI':togglePanel('bags');break;case 'KeyC':togglePanel('char');break;case 'KeyN':case 'KeyT':togglePanel('talents');break;case 'KeyL':case 'KeyJ':togglePanel('quests');break;case 'KeyM':case 'Tab':togglePanel('map');break;
   case 'Escape':if(TIP)hideTip();else if(G.panel)closePanel();else openPanel('menu');break;case 'Space':doAttack('tap');break;}});
 addEventListener('keyup',e=>{G.keys[e.code]=false;});addEventListener('blur',()=>{G.keys={};G.mswipe=null;});
 document.addEventListener('click',e=>{const ab=e.target.closest('.ab');if(ab){SFX.init();abClick(ab);return;}const ta=e.target.closest('[data-tact]');if(ta){tipAction(ta.dataset.tact);return;}const pa=e.target.closest('#pbody [data-act]');if(pa){panelAct(pa);return;}
  if(e.target.closest('#pclose')){closePanel();return;}if(e.target.closest('#bMap')||e.target.closest('#mm')){togglePanel('map');return;}if(e.target.closest('#bBags')||e.target.closest('[data-bag]')){togglePanel('bags');return;}if(e.target.closest('#bQuest')){togglePanel('quests');return;}if(e.target.closest('#bChar')){togglePanel('char');return;}if(e.target.closest('#bTal')){togglePanel('talents');return;}if(e.target.closest('#bMenu')){openPanel('menu');return;}
  if(e.target.closest('#tUse')){interact();return;}if(TIP&&!e.target.closest('#tip'))hideTip();if(e.target.id==='panel')closePanel();});
 document.addEventListener('contextmenu',e=>{const s=e.target.closest('#pbody .lrow');if(s){e.preventDefault();showTip({loc:'loot',i:s.dataset.i},s);}});
 addEventListener('resize',()=>{resize();if(G.panel==='map')drawBigMap();});}

/* ===== boot ===== */
let lastT=0;
function loop(now){const dt=Math.min(.05,lastT?(now-lastT)/1000:.016);lastT=now;
 if(G.mode==='play'&&!G.paused)update(dt);else if(G.mode==='title'){P.a+=dt*.1;W_.time+=dt;}
 try{render();}catch(e){console.error(e);}
 hud(dt);requestAnimationFrame(loop);}
function boot(){buildMap();buildTextures();buildSprites();genDecor();S=loadSave();G.localAt=(S&&S.savedAt)||0;if(!S||S.v!==1)S=newSave('warrior');for(const k in CLASSES)if(!S.classes[k])S.classes[k]=newClassSave(k);if(!S.quests)S.quests=[];restoreExplored();SFX.on=S.sound!==false;
 if(matchMedia('(pointer:coarse)').matches)enableTouch();
 resize();newRun();buildActionBar();setupInput();G.cloudPending=!window.RFC_STANDALONE;showTitle();requestAnimationFrame(loop);
 const to=setTimeout(()=>{if(G.cloudPending){G.cloudPending=false;G.cloudLate=true;if(G.mode==='title')showTitle();}},7000);
 cloudInit().then(r=>{clearTimeout(to);const wasPending=G.cloudPending;G.cloudPending=false;if(!r){if(G.mode==='title')showTitle();return;}
  if(r.save&&r.save.v===1&&r.at>=G.localAt){if(!wasPending&&G.mode!=='title'){CLOUD.blocked=true;sysMsg('Your saved progress finished loading after you started. Reload the page to pick it up.');return;}
   S=r.save;for(const k in CLASSES)if(!S.classes[k])S.classes[k]=newClassSave(k);if(!S.quests)S.quests=[];EXPLORED.fill(0);restoreExplored();SFX.on=S.sound!==false;P.maxHp=0;CLOUD.ready=true;CLOUD.last=JSON.stringify(S);CLOUD.status='cloud';newRun();buildActionBar();}
  else{CLOUD.ready=true;CLOUD.status='cloud';cloudFlush();}
  if(G.mode==='title')showTitle();});
 document.addEventListener('visibilitychange',()=>{if(document.hidden&&S){writeSave();cloudFlush();}});
 const rs=()=>{resize();setTimeout(resize,250);setTimeout(resize,700);};addEventListener('orientationchange',rs);if(window.visualViewport)visualViewport.addEventListener('resize',rs);}
boot();
</script>
